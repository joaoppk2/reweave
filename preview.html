<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reweave Local</title><link rel="stylesheet" href="styles.css"><style>:root{color-scheme:dark;--text-normal:#e5edf5;--text-muted:#a5b3c4;--background-primary:#0b1220;--background-secondary:#141f30;--background-modifier-border:#33435a;--interactive-accent:#7888d6}body{margin:0;background:var(--background-primary);color:var(--text-normal);font:14px system-ui,sans-serif}.light{color-scheme:light;--text-normal:#1f2937;--text-muted:#536174;--background-primary:#f7f8fc;--background-secondary:#eef0f6;--background-modifier-border:#c4ccda;--interactive-accent:#4d5eb5}header{padding:16px 16px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header button,dialog button{font:inherit;padding:8px;background:var(--background-secondary);color:var(--text-normal);border:1px solid var(--background-modifier-border);border-radius:6px}dialog{max-width:min(480px,80vw);background:var(--background-primary);color:var(--text-normal);border:1px solid var(--background-modifier-border);border-radius:10px}dialog::backdrop{background:#0008}#app{max-width:1400px;margin:auto}</style></head><body><header><span>Prévia sintética · sem leitura de notas</span><button id="theme">Alternar tema</button></header><main id="app"></main><script src="preview.js"></script></body></html>
